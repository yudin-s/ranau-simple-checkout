name: Plugin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Contract tests
        run: node tests/contract.test.js

      - name: Build release ZIP
        run: |
          source_slug="${GITHUB_REPOSITORY#*/}"
          package_slug="$(sed -n 's/^[[:space:]*]*Text Domain:[[:space:]]*\([^[:space:]]*\).*$/\1/p' "$source_slug.php" | head -n 1)"
          test -n "$package_slug"
          mkdir -p "plugin-build/$package_slug"
          rsync -a --exclude-from=.distignore --exclude='/plugin-build/' --exclude='/*.zip' ./ "plugin-build/$package_slug/"
          (cd plugin-build && zip -q -r "../$package_slug.zip" "$package_slug")
          unzip -t "$package_slug.zip"

      - name: WordPress Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: './plugin-build/ranau-simple-checkout-for-woocommerce'

      - uses: actions/upload-artifact@v4
        with:
          name: ranau-simple-checkout-for-woocommerce
          path: ranau-simple-checkout-for-woocommerce.zip
