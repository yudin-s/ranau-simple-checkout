name: Release ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Build and verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          source_slug="${GITHUB_REPOSITORY#*/}"
          package_slug="$(sed -n 's/^[[:space:]*]*Text Domain:[[:space:]]*\([^[:space:]]*\).*$/\1/p' "$source_slug.php" | head -n 1)"
          version="$(sed -n 's/^[[:space:]*]*Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' "$source_slug.php" | head -n 1)"
          test -n "$package_slug"
          test "$GITHUB_REF_NAME" = "v$version"
          staging="$(mktemp -d)"
          mkdir -p "$staging/$package_slug"
          rsync -a --exclude-from=.distignore --exclude='/*.zip' ./ "$staging/$package_slug/"
          (cd "$staging" && zip -q -r "$GITHUB_WORKSPACE/$package_slug-$version.zip" "$package_slug")
          unzip -t "$package_slug-$version.zip"
          shasum -a 256 "$package_slug-$version.zip" > "$package_slug-$version.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.zip ./*.zip.sha256 --verify-tag --generate-notes
